<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Our Romantic Roadmap</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@600;800&family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #72c153;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .font-pixel {
      font-family: 'Press Start 2P', cursive;
    }

    .font-romantic {
      font-family: 'Dancing Script', cursive;
    }

    .pixelated {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .btn-pixel {
      font-family: 'Press Start 2P', cursive;
      border: 2px solid #000;
      box-shadow: 3px 3px 0px 0px rgba(0,0,0,1);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .btn-pixel:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px 0px rgba(0,0,0,1);
    }

    /* Fullscreen Screen Container */
    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .screen.active {
      display: flex;
    }

    /* Top Controls Bar */
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(114, 193, 83, 0.95);
      border-bottom: 3px solid #000;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }

    /* Fullscreen Map Canvas */
    .map-wrapper {
      position: absolute;
      top: 48px;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: hidden;
    }

    .map-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Map Slot Clickable Areas */
    .pin-btn {
      position: absolute;
      transform: translate(-50%, -100%);
      background: #e11d48;
      border: 2px solid #000;
      border-radius: 50% 50% 50% 0;
      transform-origin: bottom left;
      rotate: -45deg;
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0px 0px rgba(0,0,0,0.8);
      z-index: 20;
      animation: bounce 1.8s infinite ease-in-out;
    }

    .pin-btn::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffffff;
      border: 1px solid #000;
      border-radius: 50%;
    }

    @keyframes bounce {
      0%, 100% { margin-top: 0px; }
      50% { margin-top: -6px; }
    }

    .slot-box {
      position: absolute;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2px 4px;
      z-index: 20;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    .slot-date {
      font-size: 7.5px;
      color: #e11d48;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .slot-title {
      font-size: 9.5px;
      color: #0f172a;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    /* Fullscreen Popup Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 50;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border: 4px solid #000;
      box-shadow: 6px 6px 0px 0px #000;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 18px;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- ================= LANDING PAGE ================= -->
  <div id="landing-screen" class="screen active" style="justify-content: center; align-items: center; padding: 20px; text-align: center;">
    <div style="max-width: 420px; width: 100%; background: #0f172a; color: #fff; padding: 28px 20px; border: 4px solid #000; box-shadow: 6px 6px 0px 0px #000; border-radius: 20px;">
      
      <div class="font-pixel" style="display: inline-block; background: #fbbf24; color: #000; font-size: 9px; font-weight: bold; padding: 5px 10px; border: 2px solid #000; margin-bottom: 16px;">
        ROMANTIC QUEST
      </div>

      <h1 class="font-pixel" style="color: #fde047; font-size: 30px; line-height: 1.3; margin-bottom: 12px;">
        ROAD<br><span style="color: #fb7185;">MAP</span>
      </h1>

      <p style="color: #e2e8f0; font-weight: 700; font-size: 13px; margin-bottom: 22px; line-height: 1.5;">
        A journey through our memories, one date at a time.
      </p>

      <button id="btn-start" class="btn-pixel" style="width: 100%; background: #51a331; color: #fff; padding: 14px; font-size: 11px;">
        START JOURNEY &gt;
      </button>
    </div>
  </div>

  <!-- ================= FULLSCREEN JOURNEY ROADMAP ================= -->
  <div id="journey-screen" class="screen">

    <div class="top-nav">
      <button id="btn-home" class="btn-pixel" style="background: #0f172a; color: #fff; padding: 6px 8px; font-size: 8px;">
        &lt; HOME
      </button>

      <div class="filter-tabs">
        <button class="btn-pixel filter-btn" data-chapter="all" style="background: #fbbf24; color: #000; padding: 6px 8px; font-size: 8px;">
          ALL
        </button>
        <button class="btn-pixel filter-btn" data-chapter="1" style="background: #fff; color: #000; padding: 6px 8px; font-size: 8px;">
          CH.1
        </button>
        <button class="btn-pixel filter-btn" data-chapter="2" style="background: #fff; color: #000; padding: 6px 8px; font-size: 8px;">
          CH.2
        </button>
        <button class="btn-pixel filter-btn" data-chapter="3" style="background: #fff; color: #000; padding: 6px 8px; font-size: 8px;">
          CH.3
        </button>
        <button class="btn-pixel filter-btn" data-chapter="4" style="background: #fff; color: #000; padding: 6px 8px; font-size: 8px;">
          CH.4
        </button>
      </div>
    </div>

    <!-- Full Width & Height Map Canvas -->
    <div class="map-wrapper">
      <img src="https://i.imgur.com/Q1oAPvC.jpeg" alt="Roadmap" class="map-img pixelated" />
      <div id="pins-container"></div>
    </div>

  </div>

  <!-- ================= POPUP MEMORY MODAL ================= -->
  <div id="memory-modal" class="modal-overlay">
    <div class="modal-card">
      <button id="btn-close-modal" class="btn-pixel" style="position: absolute; top: 12px; right: 12px; background: #e11d48; color: #fff; padding: 4px 8px; font-size: 10px;">
        ✕
      </button>

      <div style="display: flex; gap: 8px; align-items: center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px;">
        <span id="modal-chapter" class="font-pixel" style="color: #e11d48; font-size: 8px;">CHAPTER 1</span>
        <span id="modal-date" class="font-pixel" style="background: #fbbf24; border: 1px solid #000; padding: 2px 6px; font-size: 8px;">06.14.2025</span>
      </div>

      <img id="modal-image" src="" alt="Memory" style="width: 100%; height: 160px; object-fit: cover; border: 2px solid #000; border-radius: 8px; margin-bottom: 12px;" />

      <h2 id="modal-title" style="font-size: 18px; font-weight: 800; margin-bottom: 2px;">Title</h2>
      <p id="modal-location" style="font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 10px;">📍 Location</p>

      <p id="modal-desc" style="background: #f1f5f9; padding: 10px; border: 2px solid #000; font-size: 12px; line-height: 1.5; border-radius: 6px; margin-bottom: 12px;">
        Description
      </p>

      <button id="btn-reveal-letter" class="btn-pixel" style="width: 100%; background: #ffe4e6; color: #9f1239; padding: 10px; font-size: 9px;">
        🎁 SECRET LOVE MESSAGE
      </button>

      <div id="modal-letter" style="display: none; background: #fef3c7; border: 2px solid #000; padding: 12px; margin-top: 10px; border-radius: 6px;">
        <div class="font-pixel" style="font-size: 8px; color: #92400e; margin-bottom: 2px;">FROM THE HEART:</div>
        <p id="modal-message" class="font-romantic" style="font-size: 20px; color: #1e293b; line-height: 1.2;">
          Love note
        </p>
      </div>
    </div>
  </div>

  <script>

        image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80',
        pinTop: '73%', pinLeft: '61%', boxTop: '80%', boxLeft: '50%', width: '38%'
      },
      {
        id: 2,
        chapter: 2,
        date: '07.22.2025',
        title: 'Late Night Talks',

        pinTop: '4%', pinLeft: '90%', boxTop: '10%', boxLeft: '71%', width: '27%'
      }
    ];

    let currentFilter = 'all';

    const landingScreen = document.getElementById('landing-screen');
    const journeyScreen = document.getElementById('journey-screen');
    const btnStart = document.getElementById('btn-start');
    const btnHome = document.getElementById('btn-home');
    const pinsContainer = document.getElementById('pins-container');

    const memoryModal = document.getElementById('memory-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const modalChapter = document.getElementById('modal-chapter');
    const modalDate = document.getElementById('modal-date');
    const modalImage = document.getElementById('modal-image');
    const modalTitle = document.getElementById('modal-title');
    const modalLocation = document.getElementById('modal-location');
    const modalDesc = document.getElementById('modal-desc');
    const modalMessage = document.getElementById('modal-message');
    const modalLetter = document.getElementById('modal-letter');
    const btnRevealLetter = document.getElementById('btn-reveal-letter');

    btnStart.addEventListener('click', () => {
      landingScreen.classList.remove('active');
      journeyScreen.classList.add('active');
      renderMap();
    });

    btnHome.addEventListener('click', () => {
      journeyScreen.classList.remove('active');
      landingScreen.classList.add('active');
    });

    function renderMap() {
      pinsContainer.innerHTML = '';
      const visible = currentFilter === 'all' 
        ? MEMORIES 
        : MEMORIES.filter(m => m.chapter === parseInt(currentFilter));

      visible.forEach(mem => {
        const pin = document.createElement('div');
        pin.className = 'pin-btn';
        pin.style.top = mem.pinTop;
        pin.style.left = mem.pinLeft;
        pin.addEventListener('click', () => openModal(mem));

        const box = document.createElement('div');
        box.className = 'slot-box';
        box.style.top = mem.boxTop;
        box.style.left = mem.boxLeft;
        box.style.width = mem.width;
        box.style.height = '8.5%';

        box.innerHTML = `
          <span class="slot-date font-pixel">${mem.date}</span>
          <span class="slot-title">${mem.title}</span>
        `;
        box.addEventListener('click', () => openModal(mem));

        pinsContainer.appendChild(pin);
        pinsContainer.appendChild(box);
      });
    }

    function openModal(mem) {
      modalChapter.textContent = `CHAPTER ${mem.chapter}`;
      modalDate.textContent = mem.date;
      modalImage.src = mem.image;
      modalTitle.textContent = mem.title;
      modalLocation.textContent = `📍 ${mem.location}`;
      modalDesc.textContent = mem.desc;
      modalMessage.textContent = `"${mem.message}"`;

      modalLetter.style.display = 'none';
      btnRevealLetter.style.display = 'block';
      memoryModal.classList.add('active');
    }

    btnCloseModal.addEventListener('click', () => {
      memoryModal.classList.remove('active');
    });

    memoryModal.addEventListener('click', (e) => {
      if (e.target === memoryModal) {
        memoryModal.classList.remove('active');
      }
    });

    btnRevealLetter.addEventListener('click', () => {
      modalLetter.style.display = 'block';
      btnRevealLetter.style.display = 'none';
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.style.background = '#fff';
          b.style.color = '#000';
        });

        e.target.style.background = '#fbbf24';
        currentFilter = e.target.getAttribute('data-chapter');
        renderMap();
      });
    });
  </script>
</body>
