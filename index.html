                            </span>

                        </span>
                        <span className="text-xs font-bold bg-amber-300 px-2 py-1 border border-black">
                          {selectedMemory.date}
                        </span>
                      </div>

                      <img
                        src={selectedMemory.image}
                        alt={selectedMemory.title}
                        className="w-full h-56 object-cover border-2 border-black"
                      />

                      <div>
                        <h3 className="text-2xl font-bold text-slate-900">{selectedMemory.title}</h3>
                        <p className="text-xs font-bold text-slate-600 mt-1">📍 {selectedMemory.location}</p>
                      </div>

                      <p className="text-sm bg-slate-100 p-4 border-2 border-black leading-relaxed font-medium">
                        {selectedMemory.description}
                      </p>

                      <div>
                        {!showSecretLetter ? (
                          <button
                            onClick={() => setShowSecretLetter(true)}
                            className="w-full py-3 bg-rose-100 hover:bg-rose-200 text-rose-800 border-2 border-black font-pixel text-[10px]"
                          >
                            🎁 REVEAL SECRET LOVE MESSAGE
                          </button>
                        ) : (
                          <div className="bg-amber-100 border-2 border-black p-4">
                            <div className="text-[10px] font-pixel text-amber-800 mb-1">A MESSAGE FOR YOU:</div>
                            <p className="text-2xl text-slate-900 font-romantic leading-snug">
                              "{selectedMemory.message}"
                            </p>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Love Notes Box */}
                  <div className="bg-amber-200 border-4 border-black p-6 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] space-y-3 text-center">
                    <div className="text-xs font-pixel text-slate-900">DAILY LOVE NOTE 💌</div>
                    <p className="text-2xl text-slate-900 font-romantic italic py-2">
                      "{LOVE_NOTES[noteIndex]}"
                    </p>
                    <button
                      onClick={() => setNoteIndex((prev) => (prev + 1) % LOVE_NOTES.length)}
                      className="px-4 py-2 bg-white hover:bg-slate-100 text-slate-900 border-2 border-black font-pixel text-[9px]"
                    >
                      DRAW NEXT NOTE
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

                            }}
                          >
                            <span className="text-[7px] sm:text-[9px] font-extrabold text-rose-600 font-pixel block line-clamp-1">
                              {mem.date}
                            </span>
                            <span className="text-[9px] sm:text-[11px] font-extrabold text-slate-900 leading-tight block line-clamp-1">
                              {mem.title}
                            </span>
                          </div>
                        </React.Fragment>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MEMORY MODAL */}
          {selectedMemory && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70">
              <div className="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] max-w-md w-full max-h-[90vh] overflow-y-auto relative">
                <button
                  onClick={() => setSelectedMemory(null)}
                  className="absolute top-3 right-3 z-10 bg-rose-500 text-white font-bold px-2 py-1 border-2 border-black"
                >
                  ✕
                </button>
                <img src={selectedMemory.image} className="w-full h-48 object-cover border-b-4 border-black" />
                <div className="p-4 space-y-3">
                  <div className="text-[9px] font-bold text-rose-600 font-pixel">
                    Chapter {selectedMemory.chapterId} &bull; {selectedMemory.date}
                  </div>
                  <h3 className="text-xl font-bold">{selectedMemory.title}</h3>
                  <div className="text-xs font-bold text-slate-500">📍 {selectedMemory.location}</div>
                  <p className="text-xs bg-slate-100 p-3 border-2 border-black leading-relaxed">
                    {selectedMemory.description}
                  </p>
                  <div>
                    {!showSecretLetter ? (
                      <button
                        onClick={() => setShowSecretLetter(true)}
                        className="w-full py-2.5 bg-rose-100 text-rose-800 border-2 border-black font-pixel text-[9px]"
                      >
                        🎁 REVEAL SECRET MESSAGE
                      </button>
                    ) : (
                      <div className="bg-amber-100 border-2 border-black p-3">
                        <p className="text-xl text-slate-900 font-romantic leading-snug">
                          "{selectedMemory.message}"
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
