<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Romantic Roadmap</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- React & Babel for direct browser rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .pixelated {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .font-pixel {
      font-family: 'Press Start 2P', cursive;
    }
    .font-romantic {
      font-family: 'Dancing Script', cursive;
    }
  </style>
</head>
<body class="bg-[#72c153] text-slate-800 selection:bg-yellow-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ROADMAP_TEMPLATE_IMG = 'https://i.imgur.com/Q1oAPvC.jpeg';

    const SLOT_COORDINATES = [
      { id: 1, pinTop: '73%', pinLeft: '61%', boxTop: '80%', boxLeft: '50%', width: '38%' },
      { id: 2, pinTop: '50%', pinLeft: '23%', boxTop: '57%', boxLeft: '12%', width: '38%' },
      { id: 3, pinTop: '43%', pinLeft: '90%', boxTop: '49%', boxLeft: '71%', width: '27%' },
      { id: 4, pinTop: '27%', pinLeft: '46%', boxTop: '34%', boxLeft: '34%', width: '38%' },
      { id: 5, pinTop: '4%',  pinLeft: '90%', boxTop: '10%', boxLeft: '71%', width: '27%' }
    ];

    const CHAPTERS = [
      { id: 1, title: 'First Day' },
      { id: 2, title: 'Mutual Understanding' },
      { id: 3, title: 'Courting Stage' },
      { id: 4, title: 'Official' }
    ];

    const DEFAULT_MEMORIES = [
      {
        id: '1',
        slotIndex: 0,
        chapterId: 1,
        date: '06.14.2025',
        title: 'The First Spark',
        location: 'Cozy Corner Cafe',
        description: 'It all started on a warm summer afternoon. What was supposed to be a quick coffee turned into hours of laughter and soft glances.',
        message: 'I knew from that very first moment that my life was about to change forever.',
        image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: '2',
        slotIndex: 1,
        chapterId: 2,
        date: '07.22.2025',
        title: 'Late Night Talks',
        location: 'Under Blanket Fort',
        description: 'Talking until 3 AM about childhood dreams and favorite songs. Neither of us wanted to say goodbye first.',
        message: 'Without saying the words out loud yet, we both knew we were falling fast.',
        image: 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: '3',
        slotIndex: 2,
        chapterId: 2,
        date: '08.03.2025',
        title: 'Stargazing Hill',
        location: 'Pine Crest Lookout',
        description: 'Wrapped under a shared blanket counting shooting stars while whispering quiet secrets to the midnight sky.',
        message: 'Being with you made the entire universe feel calm, safe, and beautiful.',
        image: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: '4',
        slotIndex: 3,
        chapterId: 3,
        date: '09.18.2025',
        title: 'Flowers & Letter',
        location: 'Botanical Garden',
        description: 'Surprising you with fresh blooms and a handwritten note explaining all the reasons you make my world brighter.',
        message: 'Every single second spent courting you was the sweetest adventure of my life.',
        image: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: '5',
        slotIndex: 4,
        chapterId: 4,
        date: '12.25.2025',
        title: 'Making It Official!',
        location: 'Holiday Light Square',
        description: 'Under the glowing fairy lights, asking the big question. You smiled, hugged me close, and softly said YES!',
        message: 'The day my heart officially found its forever home right next to yours.',
        image: 'https://images.unsplash.com/photo-1512389142860-9c449e58a543?auto=format&fit=crop&w=800&q=80'
      }
    ];

    function App() {
      const [currentPage, setCurrentPage] = useState('landing');
      const [memories, setMemories] = useState(() => {
        const saved = localStorage.getItem('pixel_romance_data');
        return saved ? JSON.parse(saved) : DEFAULT_MEMORIES;
      });
      const [selectedChapterFilter, setSelectedChapterFilter] = useState('all');
      const [selectedMemory, setSelectedMemory] = useState(null);
      const [showSecretLetter, setShowSecretLetter] = useState(false);
      const [copiedLink, setCopiedLink] = useState(false);

      useEffect(() => {
        localStorage.setItem('pixel_romance_data', JSON.stringify(memories));
      }, [memories]);

      const filteredMemories = selectedChapterFilter === 'all'
        ? memories
        : memories.filter(m => m.chapterId === Number(selectedChapterFilter));

      return (
        <div className="min-h-screen bg-[#72c153]">
          {/* LANDING PAGE */}
          {currentPage === 'landing' && (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 text-center">
              <div className="max-w-md w-full bg-slate-900 text-white p-6 rounded-2xl border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] space-y-4">
                <div className="inline-block bg-amber-400 text-slate-900 text-[10px] font-bold px-3 py-1 border-2 border-black font-pixel">
                  ROMANTIC QUEST
                </div>
                <h1 className="text-3xl sm:text-4xl text-amber-300 font-pixel tracking-wider">
                  ROAD<br/><span className="text-rose-400">MAP</span>
                </h1>
                <p className="text-xs text-slate-200 font-bold">
                  A journey through our memories, one date at a time.
                </p>
                <button
                  onClick={() => setCurrentPage('journey')}
                  className="w-full py-4 bg-[#51a331] hover:bg-[#5fbd3b] text-white font-pixel text-xs sm:text-sm border-4 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:translate-x-1 active:translate-y-1 active:shadow-none"
                >
                  START JOURNEY &gt;
                </button>
              </div>
            </div>
          )}

          {/* ROADMAP PAGE */}
          {currentPage === 'journey' && (
            <div className="min-h-screen pb-12">
              {/* Top Nav */}
              <div className="sticky top-0 z-40 bg-[#72c153] border-b-4 border-black p-3 flex items-center justify-between gap-2">
                <button
                  onClick={() => setCurrentPage('landing')}
                  className="bg-white px-3 py-1.5 border-2 border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] text-[9px] font-bold font-pixel"
                >
                  &lt; HOME
                </button>
                <div className="flex gap-1 overflow-x-auto">
                  <button
                    onClick={() => setSelectedChapterFilter('all')}
                    className={`px-2 py-1 text-[9px] font-pixel border-2 border-black ${selectedChapterFilter === 'all' ? 'bg-amber-300' : 'bg-white'}`}
                  >
                    ALL
                  </button>
                  {CHAPTERS.map(ch => (
                    <button
                      key={ch.id}
                      onClick={() => setSelectedChapterFilter(ch.id)}
                      className={`px-2 py-1 text-[9px] font-pixel border-2 border-black ${selectedChapterFilter === ch.id ? 'bg-rose-400 text-white' : 'bg-white'}`}
                    >
                      CH.{ch.id}
                    </button>
                  ))}
                </div>
              </div>

              {/* Template Board */}
              <div className="max-w-md mx-auto px-3 py-4">
                <div className="bg-[#72c153] border-4 border-black rounded-3xl p-2 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                  <div className="relative w-full aspect-[9/16] rounded-2xl overflow-hidden border-2 border-black">
                    <img
                      src={ROADMAP_TEMPLATE_IMG}
                      alt="Pixel Roadmap"
                      className="w-full h-full object-cover pixelated"
                    />

                    {filteredMemories.map(mem => {
                      const slot = SLOT_COORDINATES[mem.slotIndex % SLOT_COORDINATES.length];
                      return (
                        <React.Fragment key={mem.id}>
                          {/* Red Pin */}
                          <button
                            onClick={() => {
                              setSelectedMemory(mem);
                              setShowSecretLetter(false);
                            }}
                            className="absolute z-20 hover:scale-125 transition-transform"
                            style={{
                              top: slot.pinTop,
                              left: slot.pinLeft,
                              transform: 'translate(-50%, -100%)'
                            }}
                          >
                            <div className="w-6 h-8 sm:w-8 sm:h-10 bg-rose-600 border-2 border-black rounded-t-full rounded-b-xs shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center">
                              <div className="w-2.5 h-2.5 bg-white rounded-full border border-black"></div>
                            </div>
                          </button>

                          {/* Text Slot */}
                          <div
                            onClick={() => {
                              setSelectedMemory(mem);
                              setShowSecretLetter(false);
                            }}
                            className="absolute z-20 cursor-pointer p-1 rounded flex flex-col justify-center hover:scale-105 transition-transform"
                            style={{
                              top: slot.boxTop,
                              left: slot.boxLeft,
                              width: slot.width,
                              height: '8.5%',
                              transform: 'translate(0, -50%)'
                            }}
                          >
                            <span className="text-[7px] sm:text-[9px] font-extrabold text-rose-600 font-pixel block line-clamp-1">
                              {mem.date}
                            </span>
                            <span className="text-[9px] sm:text-[11px] font-extrabold text-slate-900 leading-tight block line-clamp-1">
                              {mem.title}
                            </span>
                          </div>
                        </React.Fragment>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MEMORY MODAL */}
          {selectedMemory && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70">
              <div className="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] max-w-md w-full max-h-[90vh] overflow-y-auto relative">
                <button
                  onClick={() => setSelectedMemory(null)}
                  className="absolute top-3 right-3 z-10 bg-rose-500 text-white font-bold px-2 py-1 border-2 border-black"
                >
                  ✕
                </button>
                <img src={selectedMemory.image} className="w-full h-48 object-cover border-b-4 border-black" />
                <div className="p-4 space-y-3">
                  <div className="text-[9px] font-bold text-rose-600 font-pixel">
                    Chapter {selectedMemory.chapterId} &bull; {selectedMemory.date}
                  </div>
                  <h3 className="text-xl font-bold">{selectedMemory.title}</h3>
                  <div className="text-xs font-bold text-slate-500">📍 {selectedMemory.location}</div>
                  <p className="text-xs bg-slate-100 p-3 border-2 border-black leading-relaxed">
                    {selectedMemory.description}
                  </p>
                  <div>
                    {!showSecretLetter ? (
                      <button
                        onClick={() => setShowSecretLetter(true)}
                        className="w-full py-2.5 bg-rose-100 text-rose-800 border-2 border-black font-pixel text-[9px]"
                      >
                        🎁 REVEAL SECRET MESSAGE
                      </button>
                    ) : (
                      <div className="bg-amber-100 border-2 border-black p-3">
                        <p className="text-xl text-slate-900 font-romantic leading-snug">
                          "{selectedMemory.message}"
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
